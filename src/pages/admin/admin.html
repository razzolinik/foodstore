<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Foodstore</title>
    <link rel="stylesheet" href="/src/styles/style.css">
</head>
<body data-role="admin">

    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="./admin.html">🍔 Food<span>Store</span></a>

            <nav class="main-nav">
                <ul>
                    <li><a href="./admin.html" class="activo">Administración</a></li>
                    <li><a href="../client/home/home.html">Volver a la tienda</a></li>
                    <li><a href="#" id="logout-link">Cerrar sesión</a></li>
                </ul>
            </nav>

            <p class="usuario-actual" id="usuario-actual"></p>
        </div>
    </header>

    <div class="layout layout--simple">
    <main>

        <section>
            <h2 class="titulo-seccion">Gestión de productos</h2>

            <div class="panel tabla-scroll">
            <table>
                <thead>
                    <tr>
                        <th>Imagen</th>
                        <th>Nombre</th>
                        <th>Categoría</th>
                        <th>Precio</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-productos"></tbody>
            </table>
            </div>
        </section>

        <details open id="producto-editor">
            <summary id="producto-editor-titulo">Agregar Producto Rápido</summary>
            <form id="producto-form">
                <div>
                    <label for="nombre-producto">Nombre del Producto:</label>
                    <input type="text" id="nombre-producto" name="nombre-producto" placeholder="Ej: Lomito Completo" required>
                </div>
                <div>
                    <label for="precio-producto">Precio:</label>
                    <input type="number" id="precio-producto" name="precio-producto" min="0" step="0.01" required>
                </div>
                <div>
                    <label for="categoria-producto">Categoría:</label>
                    <select id="categoria-producto" name="categoria-producto" required>
                        <option value="">Seleccione una opción...</option>
                        <option value="Hamburguesas">Hamburguesas</option>
                        <option value="Pizzas">Pizzas</option>
                        <option value="Papas Fritas">Papas Fritas</option>
                        <option value="Bebidas">Bebidas</option>
                    </select>
                </div>
                <div>
                    <label for="descripcion-producto">Descripción:</label>
                    <textarea id="descripcion-producto" name="descripcion-producto" placeholder="Ingresa los ingredientes..."></textarea>
                </div>
                <button type="submit" class="btn-primario" id="guardar-producto">Guardar producto</button>
                <button type="button" class="btn-secundario" id="cancelar-edicion" hidden>Cancelar</button>
            </form>
        </details>

    </main>
    </div>

    <footer class="site-footer">
        <div class="footer-inner">
            <p class="footer-marca">🍔 Food Store</p>
            <p>Panel de administración &middot; v1.0</p>
            <p>&copy; 2026 Food Store</p>
        </div>
    </footer>

    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="/src/pages/admin/admin.ts"></script>
</body>
</html>
