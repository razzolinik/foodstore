<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodstore</title>
    <link rel="stylesheet" href="/src/styles/style.css">
</head>
<!-- data-role="client": main.ts's guard requires a session with rol CLIENT -->
<body data-role="client">

    <header>
        <h1>Foodstore</h1>
        <p class="usuario-actual" id="usuario-actual"></p>
        <nav>
            <ul>
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Mis Pedidos</a></li>
                <li><a href="#">Carrito (0)</a></li>
                <li><a href="#" id="logout-link">Cerrar Sesión</a></li>
            </ul>
        </nav>
    </header>

    <hr>

    <aside>
        <h2>Categorías</h2>
        <ul id="lista-categorias"></ul>
    </aside>

    <main>

        <form action="#" method="get">
            <label for="buscar-producto">Buscar productos</label>
            <input type="text" id="buscar-producto" name="buscar-producto" placeholder="Hamburguesa">
            <button type="submit">Buscar</button>
        </form>

        <section>
            <h2>Productos Destacados</h2>
            <div id="contenedor-productos" class="grid"></div>
        </section>

    </main>

    <footer>
        <p>&copy; 2024 Food Store. Todos los derechos reservados. Contacto: info@foodstore.com</p>
    </footer>

    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="/src/pages/client/client.ts"></script>
</body>
</html>
