<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Foodstore</title>
    <link rel="stylesheet" href="/src/styles/login.css">
</head>
<!-- No data-role: this is a public route. No role selector either:
     every self-registration is created as a client account. -->
<body>

    <main class="login-container">
        <form class="login-form" id="registro-form">
            <h1>Food Store</h1>
            <h2>Crear Cuenta</h2>

            <div class="campo">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required>
            </div>

            <div class="campo">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" required minlength="8">
            </div>

            <p class="mensaje-error" id="mensaje-error"></p>

            <button type="submit">Registrarme</button>

            <p class="registro">¿Ya tenés cuenta? <a href="/src/pages/auth/login/login.html">Iniciá sesión</a></p>
        </form>
    </main>

    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="/src/pages/auth/registro/registro.ts"></script>
</body>
</html>
