<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Foodstore</title>
    <link rel="stylesheet" href="/src/styles/login.css">
</head>
<!-- No data-role: this is a public route -->
<body>

    <main class="login-container">
        <form class="login-form" id="login-form">
            <h1>Food Store</h1>
            <h2>Iniciar Sesión</h2>

            <div class="campo">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required>
            </div>

            <div class="campo">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" required minlength="8">
            </div>

            <p class="mensaje-error" id="mensaje-error"></p>

            <button type="submit">Ingresar</button>

            <p class="registro">¿No tenés cuenta? <a href="/src/pages/auth/registro/registro.html">Registrate acá</a></p>
            <p class="registro" style="font-size: 12px; opacity: 0.7;">
                Cuenta admin de prueba: admin@foodstore.com / admin123
            </p>
        </form>
    </main>

    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="/src/pages/auth/login/login.ts"></script>
</body>
</html>
